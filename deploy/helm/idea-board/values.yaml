# Safe, small defaults. Environment files (values-<env>.yaml) and the AI-generated,
# schema-validated profile (artifacts/generated/values-<env>.ai.yaml) layer on top.

environment: local
nameOverride: ""
fullnameOverride: ""

backend:
  image:
    repository: idea-board-backend
    tag: dev
    pullPolicy: IfNotPresent
  replicaCount: 1
  logLevel: INFO
  maxIdeaLength: 500
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

frontend:
  image:
    repository: idea-board-frontend
    tag: dev
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

database:
  # Secret with DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD, DB_SSLMODE.
  # Created by Terraform (infra/terraform/modules/app) for in-cluster *or* managed databases.
  existingSecret: idea-board-db
  # Network egress allowed from the backend to the database.
  port: 5432
  # In-cluster PostgreSQL (Terraform modules/database/in-cluster) is matched by labels...
  podSelector:
    app.kubernetes.io/name: postgres
  # ...a managed database (RDS / Cloud SQL private IP) by CIDR.
  cidrs: []
  # Ephemeral PostgreSQL inside the release, for preview environments only (data is lost on restart).
  embedded:
    enabled: false
    image: postgres:16.6-alpine3.21

ingress:
  enabled: true
  className: nginx
  host: ideaboard.localhost
  tls:
    enabled: false
    secretName: ""

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx

topologySpread:
  enabled: false
