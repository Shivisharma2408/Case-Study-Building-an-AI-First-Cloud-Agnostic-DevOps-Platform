{{- $c := .Values.backend -}}
{{- $sel := dict "ctx" $ "component" "backend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idea-board.fullname" . }}-backend
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not $c.autoscaling.enabled }}
  replicas: {{ $c.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      {{- include "idea-board.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "idea-board.labels" . | nindent 8 }}
        {{- include "idea-board.selectorLabels" $sel | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "idea-board.podSecurityContext" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      {{- include "idea-board.topologySpread" $sel | nindent 6 }}
      containers:
        - name: backend
          image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
          imagePullPolicy: {{ $c.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ include "idea-board.dbSecretName" . }}
          env:
            - name: LOG_LEVEL
              value: {{ $c.logLevel | default "INFO" | quote }}
            - name: MAX_IDEA_LENGTH
              value: {{ $c.maxIdeaLength | default 500 | quote }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 45
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- include "idea-board.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "idea-board.fullname" . }}-backend
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "idea-board.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
