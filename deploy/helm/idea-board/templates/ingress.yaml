{{- if .Values.ingress.enabled -}}
{{- $fullname := include "idea-board.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ required "ingress.tls.secretName is required when TLS is enabled" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: {{ $fullname }}-backend, port: { name: http } }
          - path: /healthz
            pathType: Exact
            backend:
              service: { name: {{ $fullname }}-backend, port: { name: http } }
          - path: /readyz
            pathType: Exact
            backend:
              service: { name: {{ $fullname }}-backend, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $fullname }}-frontend, port: { name: http } }
{{- end }}
