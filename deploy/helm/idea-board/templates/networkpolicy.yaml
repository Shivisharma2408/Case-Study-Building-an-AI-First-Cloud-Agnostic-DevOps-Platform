{{- if .Values.networkPolicy.enabled -}}
{{- $fe := dict "ctx" $ "component" "frontend" -}}
{{- $be := dict "ctx" $ "component" "backend" -}}
{{- $db := dict "ctx" $ "component" "database" -}}
# Frontend: reachable only from the ingress controller; may talk only to DNS and the backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "idea-board.fullname" . }}-frontend
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "idea-board.selectorLabels" $fe | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              {{- include "idea-board.selectorLabels" $be | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8000 }
---
# Backend: reachable from the ingress controller and the frontend; may talk only to DNS and the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "idea-board.fullname" . }}-backend
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "idea-board.selectorLabels" $be | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        - podSelector:
            matchLabels:
              {{- include "idea-board.selectorLabels" $fe | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8000 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        {{- if .Values.database.embedded.enabled }}
        - podSelector:
            matchLabels:
              {{- include "idea-board.selectorLabels" $db | nindent 14 }}
        {{- else }}
        {{- with .Values.database.podSelector }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- range .Values.database.cidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.database.port }} }
{{- if .Values.database.embedded.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "idea-board.fullname" . }}-database
  labels:
    {{- include "idea-board.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "idea-board.selectorLabels" $db | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "idea-board.selectorLabels" $be | nindent 14 }}
      ports:
        - { protocol: TCP, port: 5432 }
  egress: []
{{- end }}
{{- end }}
