# Single-node kind cluster for the local platform.
# The ingress controller binds hostPort 80/443 on the node; kind maps them to the
# host so the app is reachable at http://<host>.localhost:8080 (see INGRESS_HTTP_PORT).
# scripts/kind-up.sh substitutes ${INGRESS_HTTP_PORT}/${INGRESS_HTTPS_PORT}.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: ${INGRESS_HTTP_PORT}
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: ${INGRESS_HTTPS_PORT}
        listenAddress: "127.0.0.1"
        protocol: TCP
