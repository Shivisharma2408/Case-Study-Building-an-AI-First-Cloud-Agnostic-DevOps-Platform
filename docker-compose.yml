# Local development stack: postgres + FastAPI backend + nginx-served React frontend.
#   cp .env.example .env && docker compose up --build
#   open http://localhost:3000
name: idea-board

services:
  postgres:
    image: postgres:16.6-alpine3.21
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ideas}
      POSTGRES_USER: ${POSTGRES_USER:-ideas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: lets a locally run backend (uvicorn --reload) use this database.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    image: idea-board-backend:dev
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-ideas}
      DB_USER: ${POSTGRES_USER:-ideas}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSLMODE: disable
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_IDEA_LENGTH: ${MAX_IDEA_LENGTH:-500}
      # Pipelines page: runs written by scripts/pipeline.sh (read-only API + approval decisions).
      PIPELINE_RUNS_DIR: /data/runs
    volumes:
      - ./artifacts/runs:/data/runs
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: idea-board-frontend:dev
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
